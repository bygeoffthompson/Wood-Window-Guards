<body>
    <nav class="bg-light mb-5 navbar navbar-expand-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">Wood Window Guards</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="how-to-measure.html">How To Measure</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="faqs.html">FAQs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="order.html">Order</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                </ul>
            </div>
        </div>

    <div class="container">
        <div class="mb-4 row">
            <div class="col-12 col-lg-8 offset-lg-2">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="mb-1">Order</h1>
                        <p class="mb-1 small text-muted">Need help measuring? <a href="how-to-measure.html">How To Measure</a></p>
                        <p class="mb-4 small text-muted">Ships to the United States only.</p>
                        <div class="mb-3 row g-3">
                            <div class="col-12 col-sm-4">
                                <label for="height" class="form-label fw-bold">Height <span class="text-danger">*</span></label>
                                <select id="height" class="form-select form-select-lg"></select>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="width" class="form-label fw-bold">Width <span class="text-danger">*</span></label>
                                <select id="width" class="form-select form-select-lg"></select>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="qty" class="form-label fw-bold">Quantity <span class="text-danger">*</span></label>
                                <select id="qty" class="form-select form-select-lg"></select>
                            </div>
                        </div>
                        <div class="mb-4 table-responsive">
                            <table class="table table-bordered mb-0" id="priceDisplay"><tbody></tbody></table>
                        </div>
                        <div id="paypal-button-container"></div>
                        <div id="order-success" class="alert alert-success mt-3 d-none">
                            <strong>Order placed!</strong> You'll receive a PayPal confirmation email. Your guard ships within 3 business days via UPS.
                        </div>
                        <div id="order-error" class="alert alert-danger mt-3 d-none">
                            Something went wrong. Please try again.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAASExiPMBB0ArjbtyM4tQZ-lHRBwKZadq3Z53fX44ZEsuS_riBsf_Tb8uLreLTp5RqWlw1gdFiPCithkQ&currency=USD"></script>
    <script>
        const heightSel = document.getElementById('height');
        const widthSel  = document.getElementById('width');
        const qtySel    = document.getElementById('qty');
        const priceDisplay = document.querySelector('#priceDisplay tbody');

        for (let h = 6; h <= 18; h++) {
            const o = document.createElement('option');
            o.value = h; o.textContent = h + '"';
            heightSel.appendChild(o);
        }
        for (let w = 18; w <= 36; w++) {
            const o = document.createElement('option');
            o.value = w; o.textContent = w + '"';
            widthSel.appendChild(o);
        }
        for (let q = 1; q <= 10; q++) {
            const o = document.createElement('option');
            o.value = q; o.textContent = q;
            qtySel.appendChild(o);
        }

        function tier(h, w) {
            const sum = h + w;
            if (sum <= 34) return { name: 'Small',  price: 32 };
            if (sum <= 44) return { name: 'Medium', price: 40 };
            return             { name: 'Large',  price: 48 };
        }

        function calc() {
            const h = parseInt(heightSel.value);
            const w = parseInt(widthSel.value);
            const q = parseInt(qtySel.value);
            const { name, price } = tier(h, w);
            const subtotal = price * q;
            const discount = q >= 2 ? +(subtotal * 0.1).toFixed(2) : 0;
            const shipping = 12;
            const total    = +(subtotal - discount + shipping).toFixed(2);
            return { h, w, q, name, price, subtotal, discount, shipping, total };
        }

        function updateDisplay() {
            const { h, w, q, name, price, subtotal, discount, shipping, total } = calc();
            let rows = `
                <tr><td>Size</td><td>${h}" Height &times; ${w}" Width <strong class="text-uppercase" style="font-size:.75rem;">${name}</strong></td></tr>
                <tr><td>Price</td><td>$${price.toFixed(2)} &times; ${q}</td></tr>`;
            if (q > 1) {
                rows += `
                <tr><td>Subtotal</td><td>$${subtotal.toFixed(2)}</td></tr>
                <tr><td class="text-success fw-bold">10% Off</td><td class="text-success fw-bold">&minus;$${discount.toFixed(2)}</td></tr>`;
            }
            rows += `
                <tr><td>Shipping</td><td>$${shipping.toFixed(2)}</td></tr>
                <tr class="fw-bold table-active"><td>Total</td><td>$${total.toFixed(2)}</td></tr>`;
            priceDisplay.innerHTML = rows;
        }

        [heightSel, widthSel, qtySel].forEach(el => el.addEventListener('change', updateDisplay));
        updateDisplay();

        paypal.Buttons({
            createOrder(data, actions) {
                const { h, w, q, name, total } = calc();
                return actions.order.create({
                    purchase_units: [{
                        description: `Wood Window Guard ${h}" H x ${w}" W (${name}) x${q}`,
                        amount: { value: total.toFixed(2), currency_code: 'USD' }
                    }]
                });
            },
            onApprove(data, actions) {
                return actions.order.capture().then(() => {
                    document.getElementById('paypal-button-container').classList.add('d-none');
                    document.getElementById('order-success').classList.remove('d-none');
                });
            },
            onError(err) {
                document.getElementById('order-error').classList.remove('d-none');
                console.error(err);
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
